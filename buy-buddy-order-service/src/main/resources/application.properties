server.port=8083
spring.application.name=buy-buddy-order-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/buybuddy_microservices_mysql_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
# Define how Hiberbate should handle Data Definition Language (DDL) operations
spring.jpa.hibernate.ddl-auto=update


# Application name (must be unique)
# spring.application.name=order-service

# Eureka Server URL
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

# Optional: Enable health checks (recommended)
# eureka.client.healthcheck.enabled=true